name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through private vulnerability reporting, never an
        issue. See SECURITY.md.

        Use placeholders such as `My Site`, `sftp.example.com` and `demo-user`.
        Never paste a password, a private key or a real host name.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `sync-servers --version`.
      placeholder: 1.0.0-alpha.0.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, terminal and Node.js version
      placeholder: Windows 11, Windows Terminal, Node.js 24.11.0
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      options:
        - Not related to a server
        - SFTP
        - FTPS (explicit)
        - FTPS (implicit)
        - FTP
        - Local or network folder
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. sync-servers site add --name "My Site" --local-root ~/sites/my-site
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: Output of the failing command with `--debug`. Check it for host names and paths before posting.
      render: text
